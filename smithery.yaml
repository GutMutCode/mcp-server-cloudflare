# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - accountId
    properties:
      accountId:
        type: string
        default: dummy-account-id
        description: Your Cloudflare account ID to run the server.
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js', 'run', config.accountId],
      env: { }
    })
  exampleConfig:
    accountId: example-cloudflare-account-id
